name: "News-Rust-bioinformation"

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate catalog
        run: cargo run --locked --release -- validate
      - name: Unit tests
        run: cargo test --locked --release
      - name: Rebuild README without network
        run: cargo run --locked --release -- build-readme
      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 8 README.md data/tools.yaml CONTRIBUTING.md
          fail: true

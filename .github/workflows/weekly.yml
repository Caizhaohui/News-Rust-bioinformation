name: weekly catalog refresh

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: pip install -r scripts/requirements.txt
      - name: Fetch GitHub metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_metadata.py
      - name: Rebuild README and radar
        run: |
          python scripts/build_readme.py
          python scripts/build_radar.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md RADAR.md data/metadata.json data/snapshots
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: weekly metadata and radar refresh"
          git push

[package]
name = "news-rust-bioinformation"
version = "0.1.0"
edition = "2021"
license = "CC0-1.0"
description = "Living catalog and weekly radar of Rust in bioinformatics"
publish = false

[[bin]]
name = "nrb"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
url = "2"

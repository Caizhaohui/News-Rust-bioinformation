name: Refresh Repository Metadata

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch GitHub metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo run --locked --release -- fetch-metadata
      - name: Rebuild README and radar
        run: |
          cargo run --locked --release -- build-readme
          cargo run --locked --release -- build-radar
      - name: Publish change summary to job summary
        run: |
          if [ -f data/diff.md ]; then
            cat data/diff.md >> $GITHUB_STEP_SUMMARY
          fi
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md RADAR.md data/metadata.json data/snapshots data/trends.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          DIFF_SUMMARY=$(cargo run --locked --release -- diff --format summary 2>/dev/null || echo "refresh repository metadata")
          git commit -m "chore(data): refresh repository metadata" -m "$DIFF_SUMMARY"
          git push
